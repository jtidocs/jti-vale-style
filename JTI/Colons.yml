extends: existence
message: "'%s' should be in lowercase."
link: 'https://developers.google.com/style/colons'
nonword: true
level: warning
scope: sentence
tokens:
  - ':\s[A-Z]\w+'
exceptions:
  - Bates
  - Criminal
  - CSV
  - JDA
  - JTI
  - Junior
  - Microsoft
  - Mr
  - PDF
  - Portable
  - Race
  - Rich
  - RTF
  - SASL
  - Windows
  - XML
